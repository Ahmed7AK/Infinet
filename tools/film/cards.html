<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Infinet film cards</title>
<!--
  Animated cards for the judges' film (tools/record/film.ts), in the brand's style (style guide v1.1). Served by the
  Vite dev server at /tools/film/cards.html; never part of the app build. Deterministic: window.__card.show(name, data)
  builds a card, window.__card.render(t, dur) draws it at t seconds, so every frame is the same on every run.
-->
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0A0B14; color: #fff; }
</style>
</head>
<body>
<div id="stage"></div>
<script type="module" src="./cards.ts"></script>
</body>
</html>
